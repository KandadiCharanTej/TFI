document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {

;border:2.5px solid #141313;border-radius:12px;padding:6px 12px\"><span class=\"mono\" style=\"font-size:30px;line-height:1.2\">₹ 20 Cr<\u002Fspan><\u002Fdiv>\n          <span class=\"btn\" style=\"width:100%;box-sizing:border-box;margin-top:10px;min-height:46px;padding:0;background:#EC1276;color:#fff;font-size:19px\">Bid ₹25 Cr<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- tape strip -->\n  <div style=\"margin:-6px 0 0;padding:10px 0;overflow:hidden\">\n    <div style=\"transform:rotate(-1.2deg);width:104%;margin-left:-2%;background:#F6BE18;border-top:3px solid #141313;border-bottom:3px solid #141313;padding:12px 0;overflow:hidden\">\n      <div class=\"track\">\n        <sc-for list=\"{{tape}}\" as=\"t\" hint-placeholder-count=\"10\"><span class=\"anton\" style=\"font-size:28px;white-space:nowrap\">{{t}}<\u002Fspan><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\"><path d=\"M3 3L17 17M17 3L3 17\" stroke=\"#141313\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fsc-for>\n        <sc-for list=\"{{tape}}\" as=\"t\" hint-placeholder-count=\"10\"><span class=\"anton\" style=\"font-size:28px;white-space:nowrap\">{{t}}<\u002Fspan><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\"><path d=\"M3 3L17 17M17 3L3 17\" stroke=\"#141313\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- games wall -->\n  <section id=\"games\" style=\"max-width:1200px;margin:0 auto;padding:72px 40px 24px;box-sizing:border-box\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px\">\n      <div>\n        <h2 class=\"anton\" style=\"margin:0;font-size:clamp(40px,6vw,72px);line-height:1\">Pick your game<\u002Fh2>\n        <p style=\"margin:10px 0 0;font-size:18px;font-weight:700\">Ten games. One phone or one room code.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\" role=\"group\" aria-label=\"Filter games\">\n        <sc-for list=\"{{filters}}\" as=\"f\" hint-placeholder-count=\"4\">\n          <button class=\"chip\" sc-camel-on-click=\"{{f.pick}}\" aria-pressed=\"{{f.on}}\" style=\"background:{{f.bg}}\"><span style=\"width:12px;height:12px;border-radius:50%;border:2px solid #141313;background:{{f.dot}}\"><\u002Fspan>{{f.name}}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px 36px;padding:0 8px\">\n      <sc-for list=\"{{games}}\" as=\"g\" hint-placeholder-count=\"10\">\n        <a class=\"gcard sticker\" href=\"{{g.href}}\" style=\"padding:18px;transform:rotate({{g.rot}}deg)\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\">\n            <span class=\"mono\" style=\"font-size:14px\">{{g.n}}<\u002Fspan>\n            <span style=\"padding:3px 12px;border:2px solid #141313;border-radius:999px;background:{{g.badgeBg}};font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase\">{{g.mode}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;height:108px;border:2.5px solid #141313;border-radius:14px;background:{{g.color}};color:#141313;display:flex;align-items:center;justify-content:center\">\n            <div style=\"width:72px;height:72px\"><dc-import name=\"Icon\" kind=\"{{g.kind}}\" hint-size=\"72px,72px\"><\u002Fdc-import><\u002Fdiv>\n          <\u002Fdiv>\n          <h3 class=\"anton\" style=\"margin:14px 0 0;font-size:28px;line-height:1.05\">{{g.name}}<\u002Fh3>\n          <p class=\"te\" style=\"margin:2px 0 0;font-size:16px;line-height:1.6;min-height:26px\">{{g.te}}<\u002Fp>\n          <p style=\"margin:2px 0 14px;font-size:14px;line-height:1.45;font-weight:500\">{{g.line}}<\u002Fp>\n          <span style=\"display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border:2.5px solid #141313;border-radius:10px;background:#F6BE18;box-shadow:3px 3px 0 #141313;font-weight:800;font-size:13px;letter-spacing:.06em\">PLAY →<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- how it plays -->\n  <section id=\"how\" style=\"margin-top:88px;background:#F6BE18;border-top:3px solid #141313;border-bottom:3px solid #141313\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:72px 40px 80px;box-sizing:border-box\">\n      <h2 class=\"anton\" style=\"margin:0;font-size:clamp(40px,6vw,72px);line-height:1\">Three steps. No manual.<\u002Fh2>\n      <div style=\"margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:44px 36px;padding:0 8px\">\n        <div class=\"sticker\" style=\"padding:22px\">\n          <span class=\"anton\" style=\"font-size:72px;line-height:1;color:#EC1276\">01<\u002Fspan>\n          <h3 class=\"anton\" style=\"margin:6px 0 0;font-size:28px\">Pick a game<\u002Fh3>\n          <p style=\"margin:8px 0 0;font-size:16px;line-height:1.55;font-weight:500\">Choose a deck, set the timer with the big plus and minus buttons, and add your gang.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"sticker\" style=\"padding:22px\">\n          <span class=\"anton\" style=\"font-size:72px;line-height:1;color:#EC1276\">02<\u002Fspan>\n          <h3 class=\"anton\" style=\"margin:6px 0 0;font-size:28px\">Play together<\u002Fh3>\n          <p style=\"margin:8px 0 0;font-size:16px;line-height:1.55;font-weight:500\">Phone on the forehead, phone in the Judge's hand, or bids flying across a room code.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"sticker\" style=\"padding:22px\">\n          <span class=\"anton\" style=\"font-size:72px;line-height:1;color:#EC1276\">03<\u002Fspan>\n          <h3 class=\"anton\" style=\"margin:6px 0 0;font-size:28px\">Share the result<\u002Fh3>\n          <p style=\"margin:8px 0 0;font-size:16px;line-height:1.55;font-weight:500\">See who scored what, send the result sticker to WhatsApp, and go again.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- auction spotlight -->\n  <section id=\"auction\" style=\"background:#141313;color:#EAE6DF\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:80px 40px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:56px;align-items:center\">\n      <div style=\"flex:1 1 420px;min-width:0\">\n        <span class=\"chip\" style=\"background:#00E5FF;color:#141313;border-color:#EAE6DF;font-size:13px\">Online · 2 to 10 friends<\u002Fspan>\n        <h2 class=\"anton\" style=\"margin:20px 0 0;font-size:clamp(40px,5.6vw,68px);line-height:1;color:#fff\">Bid on films. Hidden scores pick the winner.<\u002Fh2>\n        <ul style=\"list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:18px;line-height:1.5;font-weight:700\">\n          <li style=\"display:flex;gap:14px\"><span style=\"flex:none;margin-top:8px;width:12px;height:12px;background:#F6BE18;transform:rotate(45deg)\"><\u002Fspan>Everyone gets the same pretend purse.<\u002Fli>\n          <li style=\"display:flex;gap:14px\"><span style=\"flex:none;margin-top:8px;width:12px;height:12px;background:#F6BE18;transform:rotate(45deg)\"><\u002Fspan>Box office, word of mouth and cult value stay hidden until the end.<\u002Fli>\n          <li style=\"display:flex;gap:14px\"><span style=\"flex:none;margin-top:8px;width:12px;height:12px;background:#F6BE18;transform:rotate(45deg)\"><\u002Fspan>A late bid resets the clock, so nobody can snipe.<\u002Fli>\n        <\u002Ful>\n        <p style=\"margin:18px 0 0;font-size:14px;font-weight:500;opacity:.85\">Game coins only. There is no real-money betting.<\u002Fp>\n        <a class=\"btn\" href=\"Auction.dc.html\" style=\"margin-top:26px;background:#F6BE18;color:#141313;border-color:#EAE6DF;box-shadow:4px 4px 0 #EAE6DF\">Try the auction room →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 340px;min-width:0;max-width:440px;padding:10px\">\n        <div class=\"sticker\" style=\"padding:22px;color:#141313\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\"><span class=\"mono\" style=\"font-size:14px\">LOT 3 / 10<\u002Fspan><span class=\"mono\" style=\"padding:3px 12px;border:2.5px solid #141313;border-radius:999px;background:#00E5FF;font-size:14px\">K7QM<\u002Fspan><\u002Fdiv>\n          <p class=\"anton\" style=\"margin:14px 0 0;font-size:40px;line-height:1\">Jersey<\u002Fp>\n          <p style=\"margin:2px 0 0;font-size:14px;font-weight:700\">2019 · Gowtam Tinnanuri · base 5 Cr<\u002Fp>\n          <div style=\"display:flex;gap:8px;margin-top:14px\">\n            <div style=\"flex:1;border:2px dashed #141313;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;font-weight:800;line-height:1.3\">BOX OFFICE<br><span class=\"mono\" style=\"font-size:18px\">???<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1;border:2px dashed #141313;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;font-weight:800;line-height:1.3\">TALK<br><span class=\"mono\" style=\"font-size:18px\">???<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1;border:2px dashed #141313;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;font-weight:800;line-height:1.3\">CULT<br><span class=\"mono\" style=\"font-size:18px\">???<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;background:#F6BE18;border:2.5px solid #141313;border-radius:14px;padding:8px 16px\"><span style=\"font-size:11px;font-weight:800;letter-spacing:.12em\">CURRENT BID<\u002Fspan><br><span class=\"mono\" style=\"font-size:44px;line-height:1.15\">₹ 20 Cr<\u002Fspan><\u002Fdiv>\n          <span class=\"btn\" style=\"width:100%;box-sizing:border-box;margin-top:14px;background:#EC1276;color:#fff;font-size:20px\">Bid ₹25 Cr<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Telugu first -->\n  <section style=\"max-width:1200px;margin:0 auto;padding:88px 40px 24px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:56px;align-items:center\">\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <h2 class=\"anton\" style=\"margin:0;font-size:clamp(40px,5.6vw,68px);line-height:1\">Telugu first.<br>Two scripts on every card.<\u002Fh2>\n      <p style=\"margin:18px 0 0;max-width:520px;font-size:18px;line-height:1.55;font-weight:700\">Every title, dialogue and clue shows in Telugu script with English letters underneath, so the whole room can read it.<\u002Fp>\n      <p style=\"margin:26px 0 8px;font-size:13px;font-weight:800;letter-spacing:.12em\">YOUR FAN VIBE (OPTIONAL)<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\" role=\"group\" aria-label=\"Fan vibe\">\n        <sc-for list=\"{{vibes}}\" as=\"v\" hint-placeholder-count=\"7\">\n          <button class=\"chip\" sc-camel-on-click=\"{{v.pick}}\" aria-pressed=\"{{v.on}}\" style=\"background:{{v.bg}}\">{{v.name}}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 340px;min-width:0;max-width:440px;padding:10px\">\n      <div class=\"sticker\" style=\"padding:24px;text-align:center;transform:rotate(-1.5deg)\">\n        <span class=\"chip\" style=\"min-height:34px;font-size:12px;background:#F6BE18\">Playing as {{vibe}}<\u002Fspan>\n        <p class=\"te\" style=\"margin:14px 0 0;font-size:80px;line-height:1.35\">పోకిరి<\u002Fp>\n        <p style=\"margin:0;font-size:32px;font-weight:800\">Pokiri<\u002Fp>\n        <p style=\"margin:10px 0 0;display:inline-block;padding:4px 14px;border:2px solid #141313;border-radius:999px;background:#F4F1EA;font-size:13px;font-weight:800\">2006 · Puri Jagannadh<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- closing -->\n  <section style=\"max-width:1200px;margin:0 auto;padding:72px 40px 56px;box-sizing:border-box\">\n    <div class=\"sticker\" style=\"padding:48px 32px;text-align:center;background:#F6BE18;margin:0 8px\">\n      <h2 class=\"anton\" style=\"margin:0;font-size:clamp(40px,6vw,76px);line-height:1\">Your gang is waiting.<\u002Fh2>\n      <p class=\"te\" style=\"margin:10px 0 0;font-size:26px;line-height:1.6\">ఆడుకుందాం<\u002Fp>\n      <a class=\"btn\" href=\"Home.dc.html\" style=\"margin-top:18px;background:#fff\">Play now →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#141313;color:#EAE6DF\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:28px 40px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:10px 32px;justify-content:space-between;font-size:14px;line-height:1.5\">\n      <span class=\"anton\" style=\"font-size:22px\">TFI &amp; Pitch<\u002Fspan>\n      <span style=\"max-width:640px\">An unofficial fan-made game. Not affiliated with any film, actor, studio, cricket league or team. Beta preview · working name.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3900}}\">\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { vibe: 'bhAAi', filter: 'All' }; }\n  renderVals() {\n    const s = this.state;\n    const dots = { All: '#fff', Cinema: '#F6BE18', Cricket: '#00C853', Party: '#EC1276' };\n    const vibes = ['bhAAi', 'Bob', 'Darling', 'Tarak', 'OG', 'Boss', 'Nani'].map((n) => ({\n      name: n, on: s.vibe === n, bg: s.vibe === n ? '#F6BE18' : '#FFFFFF', pick: () => this.setState({ vibe: n })\n    }));\n    const filters = ['All', 'Cinema', 'Cricket', 'Party'].map((n) => ({\n      name: n, on: s.filter === n, bg: s.filter === n ? '#F6BE18' : '#FFFFFF', dot: dots[n], pick: () => this.setState({ filter: n })\n    }));\n    const Y = '#F6BE18', G = '#00C853', M = '#EC1276';\n    const all = [\n      { cat: 'Cinema', kind: 'head', name: 'Head Set Go', te: 'హెడ్ సెట్ గో', line: 'Phone on your forehead. Friends shout clues.', mode: 'One phone', color: Y, href: 'HeadSetGo.dc.html' },\n      { cat: 'Cinema', kind: 'trans', name: 'Transify', te: 'ట్రాన్సిఫై', line: 'Decode funny broken-English movie titles.', mode: 'One phone', color: Y, href: 'Home.dc.html' },\n      { cat: 'Cinema', kind: 'charades', name: 'Dumb Charades', te: 'డంబ్ షరాడ్స్', line: 'Act it out. Team against team.', mode: 'One phone', color: Y, href: 'Home.dc.html' },\n      { cat: 'Cinema', kind: 'emoji', name: 'Emoji Cinema', te: 'ఎమోజీ సినిమా', line: 'Guess the film from a string of emoji.', mode: 'Phone or online', color: Y, href: 'Home.dc.html' },\n      { cat: 'Cinema', kind: 'auction', name: 'Box Office Auction', te: 'బాక్స్ ఆఫీస్ ఆక్షన్', line: 'Bid on films. Hidden scores pick the winner.', mode: 'Online', color: Y, href: 'Auction.dc.html' },\n      { cat: 'Cricket', kind: 'cricketiq', name: 'Cricket IQ', te: '', line: 'Cricketers, records and iconic moments.', mode: 'Phone or online', color: G, href: 'Home.dc.html' },\n      { cat: 'Cricket', kind: 'dream', name: 'Dream XI Challenge', te: '', line: 'Pick eleven within a budget.', mode: 'Online', color: G, href: 'Home.dc.html' },\n      { cat: 'Cricket', kind: 'cricketauction', name: 'Cricket Auction', te: '', line: 'Spend a pretend purse and build your side.', mode: 'Online', color: G, href: 'Auction.dc.html' },\n      { cat: 'Party', kind: 'rapid', name: 'Rapid Fire', te: '', line: 'Funny Telugu questions against the clock.', mode: 'One phone', color: M, href: 'Home.dc.html' },\n      { cat: 'Party', kind: 'most', name: 'Most Likely', te: '', line: 'Vote on which friend would do the silliest thing.', mode: 'Phone or online', color: M, href: 'Home.dc.html' }\n    ];\n    const rots = [-1, 0.8, -0.6, 1, -0.8];\n    const games = all.filter((g) => s.filter === 'All' || g.cat === s.filter).map((g, i) => ({\n      ...g, n: String(all.indexOf(g) + 1).padStart(2, '0'), rot: rots[i % rots.length],\n      badgeBg: g.mode === 'Online' ? '#00E5FF' : '#FFFFFF'\n    }));\n    return { vibes, filters, vibe: s.vibe, games, tape: ['Head Set Go', 'Transify', 'Dumb Charades', 'Emoji Cinema', 'Box Office Auction', 'Cricket IQ', 'Dream XI', 'Cricket Auction', 'Rapid Fire', 'Most Likely'] };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
